name: Keep alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the live app
        run: |
          for i in 1 2 3; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 120 https://readmission-risk.onrender.com/) && \
              echo "attempt $i -> HTTP $code" && [ "$code" = "200" ] && exit 0
            sleep 30
          done
          echo "app did not return 200 after 3 attempts"
          exit 1
