<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Readmission Risk</title>
  <script>
    // Apply the saved theme before first paint, so a reload never flashes the wrong theme.
    try {
      const t = localStorage.getItem("theme");
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    } catch {}
  </script>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
</head>
<body>
<main>
  <div class="theme" role="group" aria-label="Theme">
    <button type="button" data-theme-choice="light">Light</button>
    <button type="button" data-theme-choice="system">System</button>
    <button type="button" data-theme-choice="dark">Dark</button>
  </div>
  <h1>30-day readmission risk</h1>
  <p id="status">Loading model schema…</p>

  <nav class="steps" id="steps">
    <span class="step is-active" data-step="1"><b>1</b> Encounter</span>
    <span class="step" data-step="2"><b>2</b> Patient</span>
    <span class="step" data-step="3"><b>3</b> Result</span>
  </nav>
  <div class="progress"><div class="progress-bar" id="progress"></div></div>

  <form id="form">
    <section class="panel" data-panel="1">
      <div class="examples">
        <span>Try an example:</span>
        <button type="button" class="ghost" data-example="typical">Typical encounter</button>
        <button type="button" class="ghost" data-example="frequent">Frequent readmitter</button>
        <button type="button" class="ghost" data-example="elderly">Age 90+ (out of scope)</button>
      </div>
      <fieldset>
        <legend>Encounter</legend>
        <div id="numeric" class="grid"></div>
      </fieldset>
      <div class="actions">
        <span></span>
        <button type="button" data-next>Next: patient →</button>
      </div>
    </section>

    <section class="panel" data-panel="2" hidden>
      <fieldset>
        <legend>Patient &amp; clinical</legend>
        <div id="categorical" class="grid"></div>
      </fieldset>
      <div class="actions">
        <button type="button" class="ghost" data-back>← Back</button>
        <button type="submit">Predict →</button>
      </div>
    </section>

    <section class="panel" data-panel="3" hidden>
      <div id="result"></div>
      <div id="accuracy"></div>
      <div class="actions">
        <button type="button" class="ghost" data-back>← Edit patient</button>
        <button type="button" data-restart>Start over</button>
      </div>
    </section>
  </form>
</main>

  <script>
    // Fields where "not recorded" is a real, meaningful state in the data.
    // Sending null lets the pipeline's imputer map it to the MISSING category,
    // the same way it was handled in training.
    const NULLABLE = new Set(["race", "A1Cresult", "max_glu_serum"]);
    let META = null;

    // The meter runs 0-50%: almost every real encounter lands below that.
    const METER_MAX = 0.5;

    // Example patients: only the listed fields change; everything else stays at its default.
    const EXAMPLES = {
      typical: {},
      frequent: { number_inpatient: 4, number_emergency: 2, time_in_hospital: 7, num_medications: 22, insulin: "Up", change: "Ch" },
      elderly: { age: "[90-100)", number_inpatient: 1, discharge_disposition_id: "3" },
    };

    function applyExample(form, schema, overrides) {
      for (const el of form.elements) {
        if (!el.name) continue;
        const info = schema.numeric[el.name] ?? schema.categorical[el.name];
        const base = el.type === "number" ? info.median : info.default;
        el.value = el.name in overrides ? overrides[el.name] : base;
      }
    }

    // Clinician-facing labels; the raw feature name is still shown underneath.
    const LABELS = {
      time_in_hospital: "Days in hospital",
      num_lab_procedures: "Lab procedures",
      num_procedures: "Procedures",
      num_medications: "Medications",
      number_outpatient: "Outpatient visits (prior year)",
      number_emergency: "Emergency visits (prior year)",
      number_inpatient: "Inpatient stays (prior year)",
      number_diagnoses: "Diagnoses",
      race: "Race",
      gender: "Gender",
      age: "Age band",
      admission_type_id: "Admission type (code)",
      discharge_disposition_id: "Discharge destination",
      admission_source_id: "Admission source (code)",
      A1Cresult: "HbA1c result",
      max_glu_serum: "Glucose serum",
      insulin: "Insulin",
      change: "Medication changed",
      diabetesMed: "On diabetes medication",
      diag_1_group: "Primary diagnosis",
      diag_2_group: "Secondary diagnosis",
      diag_3_group: "Additional diagnosis",
    };
    const label = (name) => LABELS[name] ?? name.replaceAll("_", " ");
    const pct = (p) => (p * 100).toFixed(1) + "%";

    function numericField(name, info) {
      const wrap = document.createElement("label");
      wrap.innerHTML = `<span class="lbl">${label(name)}</span><span class="key">${name}</span>`;
      const input = document.createElement("input");
      input.type = "number";
      input.name = name;
      input.min = info.min;
      input.max = info.max;
      input.step = 1;
      input.value = info.median;
      input.required = true;
      wrap.appendChild(input);
      return wrap;
    }

    function categoricalField(name, info) {
      const wrap = document.createElement("label");
      wrap.innerHTML = `<span class="lbl">${label(name)}</span><span class="key">${name}</span>`;
      const select = document.createElement("select");
      select.name = name;
      if (NULLABLE.has(name)) {
        select.add(new Option("Not recorded", ""));
      }
      // ID codes arrive sorted as strings ("1", "10", "11", "2"); show them in numeric order.
      const options = [...info.options];
      if (options.every(o => !isNaN(o))) options.sort((a, b) => a - b);
      for (const opt of options) {
        select.add(new Option(opt, opt, false, opt === info.default));
      }
      wrap.appendChild(select);
      return wrap;
    }

    function buildForm(schema) {
      const num = document.getElementById("numeric");
      const cat = document.getElementById("categorical");
      for (const [name, info] of Object.entries(schema.numeric)) {
        num.appendChild(numericField(name, info));
      }
      for (const [name, info] of Object.entries(schema.categorical)) {
        cat.appendChild(categoricalField(name, info));
      }
    }

    function readForm(form) {
      const features = {};
      for (const el of form.elements) {
        if (!el.name) continue;
        if (el.type === "number") {
          features[el.name] = Number(el.value);
        } else {
          features[el.name] = el.value === "" ? null : el.value;
        }
      }
      return features;
    }

    function driversHtml(drivers) {
      if (!drivers || !drivers.length) return "";
      const max = Math.max(...drivers.map(d => Math.abs(d.delta)));
      const rows = drivers.map(d => {
        const pts = (d.delta * 100).toFixed(1);
        const dir = d.delta > 0 ? "up" : "down";
        const width = Math.round(Math.abs(d.delta) / max * 100);
        const value = d.value === null ? "not recorded" : d.value;
        return `<li class="driver driver-${dir}">
          <span class="driver-name">${label(d.feature)}<small>${value} · typical ${d.default}</small></span>
          <span class="driver-bar"><i style="width:${width}%"></i></span>
          <span class="driver-delta">${d.delta > 0 ? "+" : ""}${pts} pts</span>
        </li>`;
      }).join("");
      return `<div class="drivers">
        <h3>What's driving this score</h3>
        <ul>${rows}</ul>
        <p class="clear">Each row is how much the risk would change if that one field were at its typical value.
        One field at a time — interactions between fields aren't captured.</p>
      </div>`;
    }

    function accuracyHtml(ev) {
      // Bars share one scale so the climb across bands is visible; the tick is the predicted mean.
      const scale = 0.6;
      const rows = ev.bands.map(b => {
        const [lo, hi] = b.observed_ci95;
        return `
          <span class="band band-${b.band}">${b.band}</span>
          <span class="n">${b.n.toLocaleString()}</span>
          <span class="cal-bar band-${b.band}">
            <i style="width:${Math.min(b.observed_rate / scale, 1) * 100}%"></i>
            <b style="left:${Math.min(b.predicted_mean / scale, 1) * 100}%" title="predicted ${pct(b.predicted_mean)}"></b>
          </span>
          <span class="obs">${pct(b.observed_rate)} <small>(${pct(lo)}–${pct(hi)})</small></span>`;
      }).join("");
      return `<div class="card accuracy">
        <h2>How accurate is it?</h2>
        <p class="sub">${ev.n.toLocaleString()} patients the model never saw, held out by patient id.
          Bars are the share actually readmitted; the tick is what the model predicted.</p>
        <div class="cal">
          <span class="h">Band</span><span class="h">Patients</span><span class="h">Observed vs predicted</span><span class="h">Readmitted (95% CI)</span>
          ${rows}
        </div>
        <p class="foot">PR-AUC ${ev.pr_auc.toFixed(3)} · ROC-AUC ${ev.roc_auc.toFixed(3)} on this sample
          (5-fold CV on the full data: PR-AUC ${META.cv_pr_auc.toFixed(3)}).
          Small bands carry wide intervals — a few patients move the high-band rate by several points.</p>
      </div>`;
    }

    function render(data) {
      const out = document.getElementById("result");
      const caveats = data.caveats.length
        ? `<div class="caveats">
             <h3>⚠ Known limitations for this patient</h3>
             ${data.caveats.map(c => `<p>${c}</p>`).join("")}
             <p><strong>Do not rely on this score.</strong></p>
           </div>`
        : "";
      const fill = Math.min(data.probability / METER_MAX, 1) * 100;
      const base = (data.baseline_rate / METER_MAX) * 100;
      out.innerHTML = `
        <div class="card">
          <div class="hero">${pct(data.probability)}</div>
          <div class="compare">
            predicted 30-day readmission risk ·
            ${data.lift_vs_baseline}× the ${pct(data.baseline_rate)} baseline
          </div>
          <span class="band band-${data.band}">${data.band} risk</span>
          <div class="meter band-${data.band}">
            <div class="meter-track">
              <div class="meter-fill" style="width:${fill}%"></div>
              <div class="meter-base" style="left:${base}%" title="baseline ${pct(data.baseline_rate)}"></div>
            </div>
            <div class="meter-scale">
              <span>0%</span><span class="base">baseline ${pct(data.baseline_rate)}</span><span>${pct(METER_MAX)}</span>
            </div>
          </div>
          ${driversHtml(data.drivers)}
          ${caveats || '<p class="clear">No subgroup caveats apply — this patient is within the population the model was validated on.</p>'}
        </div>`;
    }

    async function predict(event) {
      event.preventDefault();
      const features = readForm(event.target);
      const res = await fetch("/predict", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ features }),
      });
      const data = await res.json();
      if (!res.ok) {
        document.getElementById("result").innerHTML =
          `<p class="error">Error ${res.status}: ${data.detail}</p>`;
      } else {
        render(data);
      }
      goTo(3);
    }

    // Wizard: show one panel at a time; keep the tabs and progress bar in sync.
    let currentStep = 1;
    function goTo(step) {
      currentStep = step;
      for (const p of document.querySelectorAll(".panel")) {
        p.hidden = Number(p.dataset.panel) !== step;
      }
      for (const s of document.querySelectorAll(".step")) {
        const n = Number(s.dataset.step);
        s.classList.toggle("is-active", n === step);
        s.classList.toggle("is-done", n < step);
      }
      document.getElementById("progress").style.width = (step / 3 * 100) + "%";
      window.scrollTo({ top: 0, behavior: "smooth" });
    }
    function panelIsValid(step) {
      const fields = document.querySelectorAll(`.panel[data-panel="${step}"] :is(input, select)`);
      for (const el of fields) if (!el.reportValidity()) return false;
      return true;
    }

    // Theme: "system" leaves it to the OS; "light"/"dark" force it via color-scheme.
    function applyTheme(mode) {
      if (mode === "system") delete document.documentElement.dataset.theme;
      else document.documentElement.dataset.theme = mode;
      for (const b of document.querySelectorAll("[data-theme-choice]")) {
        b.classList.toggle("is-active", b.dataset.themeChoice === mode);
      }
      try { localStorage.setItem("theme", mode); } catch {}
    }

    async function main() {
      const schema = await fetch("/schema").then(r => r.json());
      const meta = await fetch("/metadata").then(r => r.json());
      META = meta;
      fetch("/evaluation").then(r => r.ok ? r.json() : null).then(ev => {
        if (ev) document.getElementById("accuracy").innerHTML = accuracyHtml(ev);
      });

      const nNum = Object.keys(schema.numeric).length;
      const nCat = Object.keys(schema.categorical).length;
      document.getElementById("status").textContent =
        `Gradient boosting · 5-fold GroupKFold PR-AUC ${meta.cv_pr_auc.toFixed(3)} · ` +
        `${nNum} numeric + ${nCat} categorical inputs`;

      buildForm(schema);

      const form = document.getElementById("form");
      form.addEventListener("submit", predict);
      for (const b of document.querySelectorAll("[data-example]")) {
        b.addEventListener("click", () => {
          applyExample(form, schema, EXAMPLES[b.dataset.example]);
          form.requestSubmit();
        });
      }
      document.querySelector("[data-next]").addEventListener("click", () => {
        if (panelIsValid(1)) goTo(2);
      });
      for (const b of document.querySelectorAll("[data-back]")) {
        b.addEventListener("click", () => goTo(currentStep - 1));
      }
      document.querySelector("[data-restart]").addEventListener("click", () => {
        applyExample(form, schema, {});          // back to schema defaults
        document.getElementById("result").innerHTML = "";
        goTo(1);
      });

      let savedTheme = "system";
      try { savedTheme = localStorage.getItem("theme") || "system"; } catch {}
      applyTheme(savedTheme);
      for (const b of document.querySelectorAll("[data-theme-choice]")) {
        b.addEventListener("click", () => applyTheme(b.dataset.themeChoice));
      }

      goTo(1);
    }

    main().catch(err => {
      document.getElementById("status").textContent = "Failed to load: " + err;
    });
  </script>
</body>
</html>
