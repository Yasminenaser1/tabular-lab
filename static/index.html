<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Readmission Risk</title>
  <style>
    :root {
      --bg: #fafaf8; --card: #ffffff; --ink: #1a1a19; --muted: #5f5e5a;
      --line: #dedcd6; --accent: #2f6fed;
      --good: #0ca30c; --warning: #fab219; --critical: #d03b3b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 2rem 1rem; background: var(--bg); color: var(--ink);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { max-width: 760px; margin: 0 auto; }
    h1 { font-size: 1.6rem; margin: 0 0 .25rem; }
    #status { color: var(--muted); margin: 0 0 1.5rem; }
    fieldset {
      border: 1px solid var(--line); border-radius: 8px; background: var(--card);
      padding: 1rem 1.25rem; margin: 0 0 1rem;
    }
    legend { font-weight: 600; padding: 0 .4rem; }
    .grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: .75rem 1rem;
    }
    label { display: flex; flex-direction: column; gap: .2rem; font-size: .85rem; color: var(--muted); }
    input, select {
      font: inherit; color: var(--ink); padding: .4rem .5rem;
      border: 1px solid var(--line); border-radius: 6px; background: #fff;
    }
    button {
      font: inherit; font-weight: 600; color: #fff; background: var(--accent);
      border: 0; border-radius: 6px; padding: .6rem 1.2rem; cursor: pointer;
    }
    #result { margin-top: 1.5rem; }
    .card {
      border: 1px solid var(--line); border-radius: 8px; background: var(--card);
      padding: 1.25rem 1.5rem;
    }
    .hero { font-size: 48px; font-weight: 600; line-height: 1.1; }
    .compare { color: var(--muted); margin: .25rem 0 .75rem; }
    .band {
      display: inline-flex; align-items: center; gap: .4rem;
      font-weight: 600; font-size: .9rem;
    }
    .band::before {
      content: ""; width: 10px; height: 10px; border-radius: 50%;
      background: var(--dot);
    }
    .band-low { --dot: var(--good); }
    .band-elevated { --dot: var(--warning); }
    .band-high { --dot: var(--critical); }
    .caveats {
      margin-top: 1rem; padding: .9rem 1rem; border-radius: 6px;
      border: 1px solid var(--critical); border-left-width: 6px; background: #fff6f6;
    }
    .caveats h3 { margin: 0 0 .4rem; font-size: 1rem; }
    .caveats p { margin: .25rem 0; }
    .error { color: var(--critical); }
  </style>
</head>
<body>
<main>
  <h1>30-day readmission risk</h1>
  <p id="status">Loading model schema…</p>

  <form id="form">
    <fieldset>
      <legend>Encounter</legend>
      <div id="numeric" class="grid"></div>
    </fieldset>
    <fieldset>
      <legend>Patient &amp; clinical</legend>
      <div id="categorical" class="grid"></div>
    </fieldset>
    <button type="submit">Predict</button>
  </form>

  <section id="result"></section>
</main>

  <script>
    // Fields where "not recorded" is a real, meaningful state in the data.
    // Sending null lets the pipeline's imputer map it to the MISSING category,
    // the same way it was handled in training.
    const NULLABLE = new Set(["race", "A1Cresult", "max_glu_serum"]);

    const label = (name) => name.replaceAll("_", " ");
    const pct = (p) => (p * 100).toFixed(1) + "%";

    function numericField(name, info) {
      const wrap = document.createElement("label");
      wrap.textContent = label(name);
      const input = document.createElement("input");
      input.type = "number";
      input.name = name;
      input.min = info.min;
      input.max = info.max;
      input.step = 1;
      input.value = info.median;
      input.required = true;
      wrap.appendChild(input);
      return wrap;
    }

    function categoricalField(name, info) {
      const wrap = document.createElement("label");
      wrap.textContent = label(name);
      const select = document.createElement("select");
      select.name = name;
      if (NULLABLE.has(name)) {
        select.add(new Option("Not recorded", ""));
      }
      // ID codes arrive sorted as strings ("1", "10", "11", "2"); show them in numeric order.
      const options = [...info.options];
      if (options.every(o => !isNaN(o))) options.sort((a, b) => a - b);
      for (const opt of options) {
        select.add(new Option(opt, opt, false, opt === info.default));
      }
      wrap.appendChild(select);
      return wrap;
    }

    function buildForm(schema) {
      const num = document.getElementById("numeric");
      const cat = document.getElementById("categorical");
      for (const [name, info] of Object.entries(schema.numeric)) {
        num.appendChild(numericField(name, info));
      }
      for (const [name, info] of Object.entries(schema.categorical)) {
        cat.appendChild(categoricalField(name, info));
      }
    }

    function readForm(form) {
      const features = {};
      for (const el of form.elements) {
        if (!el.name) continue;
        if (el.type === "number") {
          features[el.name] = Number(el.value);
        } else {
          features[el.name] = el.value === "" ? null : el.value;
        }
      }
      return features;
    }

    function render(data) {
      const out = document.getElementById("result");
      const caveats = data.caveats.length
        ? `<div class="caveats">
             <h3>⚠ Known limitations for this patient</h3>
             ${data.caveats.map(c => `<p>${c}</p>`).join("")}
             <p><strong>Do not rely on this score.</strong></p>
           </div>`
        : "";
      out.innerHTML = `
        <div class="card">
          <div class="hero">${pct(data.probability)}</div>
          <div class="compare">
            predicted 30-day readmission risk ·
            ${data.lift_vs_baseline}× the ${pct(data.baseline_rate)} baseline
          </div>
          <span class="band band-${data.band}">${data.band} risk</span>
          ${caveats}
        </div>`;
    }

    async function predict(event) {
      event.preventDefault();
      const features = readForm(event.target);
      const res = await fetch("/predict", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ features }),
      });
      const data = await res.json();
      if (!res.ok) {
        document.getElementById("result").innerHTML =
          `<p class="error">Error ${res.status}: ${data.detail}</p>`;
        return;
      }
      render(data);
    }

    async function main() {
      const schema = await fetch("/schema").then(r => r.json());
      const meta = await fetch("/metadata").then(r => r.json());

      const nNum = Object.keys(schema.numeric).length;
      const nCat = Object.keys(schema.categorical).length;
      document.getElementById("status").textContent =
        `Gradient boosting · 5-fold GroupKFold PR-AUC ${meta.cv_pr_auc.toFixed(3)} · ` +
        `${nNum} numeric + ${nCat} categorical inputs`;

      buildForm(schema);
      document.getElementById("form").addEventListener("submit", predict);
    }

    main().catch(err => {
      document.getElementById("status").textContent = "Failed to load: " + err;
    });
  </script>
</body>
</html>
